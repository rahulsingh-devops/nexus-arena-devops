apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-frontend
  namespace: nexus-arena
  labels:
    app: nexus-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-frontend
  template:
    metadata:
      labels:
        app: nexus-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: nexus-arena-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 5173
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: false  # NGINX requires root for binding
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
      terminationGracePeriodSeconds: 15
